name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy app

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE: /api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config >/dev/null

      - name: Build all images
        run: docker compose build

  deploy:
    runs-on: ubuntu-latest
    needs: [compose]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from secret
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "${ENV_FILE}" ]; then
            echo "::error::ENV_FILE secret is empty. Add production .env contents to the ENV_FILE GitHub secret."
            exit 1
          fi
          printf "%s" "$ENV_FILE" > .env

      - name: Build production images
        run: docker compose build

      - name: Save images
        run: |
          docker save -o images.tar landloads-backend:latest landloads-frontend:latest
          ls -la images.tar

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf "%s" "$SERVER_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Verify SSH connectivity
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o ConnectTimeout=30 -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" "echo SSH OK" || {
            echo "::error::SSH connection failed. Check SERVER_HOST, SERVER_USER, and SERVER_SSH_KEY secrets."
            exit 1
          }

      - name: Ensure server directory exists
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=60 -o ServerAliveCountMax=3 \
            "$SERVER_USER@$SERVER_HOST" "mkdir -p /root/landloads/deploy"

      - name: Sync config and images to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync -avz -e "ssh -o ConnectTimeout=60 -o ServerAliveInterval=60 -o ServerAliveCountMax=3" \
            .env \
            docker-compose.yml \
            images.tar \
            "$SERVER_USER@$SERVER_HOST:/root/landloads/"
          rsync -avz -e "ssh -o ConnectTimeout=60 -o ServerAliveInterval=60 -o ServerAliveCountMax=3" \
            deploy/ \
            "$SERVER_USER@$SERVER_HOST:/root/landloads/deploy/"

      - name: Load image and restart on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o ConnectTimeout=60 -o ServerAliveInterval=60 -o ServerAliveCountMax=3 \
            "$SERVER_USER@$SERVER_HOST" <<'REMOTE'
          set -e
          cd /root/landloads
          docker load -i images.tar
          rm -f images.tar
          docker compose up -d --no-build --remove-orphans
          docker compose run --rm backend alembic upgrade head
          docker image prune -f
          docker compose ps
          REMOTE
