[project]
name = "landloads-backend"
version = "0.1.0"
description = "Landloads backend API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy[asyncio]>=2.0.32,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "redis>=5.0,<6.0",
    "arq>=0.26,<1.0",
    "minio>=7.2,<8.0",
    "structlog>=24.4,<26.0",
    "httpx>=0.27,<1.0",
    "sentry-sdk[fastapi]>=2.13,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "pyjwt>=2.9,<3.0",
    "itsdangerous>=2.2,<3.0",
    "email-validator>=2.2,<3.0",
    "python-multipart>=0.0.12,<1.0",
    "jinja2>=3.1,<4.0",
    "freezegun>=1.5,<2.0",
    "reportlab>=4.2,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "testcontainers[postgres,redis]>=4.8,<5.0",
    "respx>=0.21,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
