# Safaricom Daraja webhook IP allowlist (per design §4.1.6 + §8 hardening).
#
# Daraja's published webhook ranges as of 2026-04 (verify quarterly with
# Safaricom's developer portal — they do change). To activate, replace the
# `# require_ip` placeholder block in `default.conf` with `include
# conf.d/mpesa-allowlist.conf;` inside the `/api/webhooks/mpesa/` location.
#
# IPs:
geo $is_daraja {
    default 0;
    196.201.214.200/32 1;
    196.201.214.206/32 1;
    196.201.213.114/32 1;
    196.201.214.207/32 1;
    196.201.214.208/32 1;
    196.201.213.44/32  1;
    196.201.212.127/32 1;
    196.201.212.138/32 1;
    196.201.212.129/32 1;
    196.201.212.136/32 1;
    196.201.212.74/32  1;
    196.201.212.69/32  1;
}

# Use inside the M-Pesa webhook location:
#
# location /api/webhooks/mpesa/ {
#     if ($is_daraja = 0) { return 403; }
#     proxy_pass http://backend_upstream;
# }
