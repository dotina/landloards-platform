# Production Nginx config — TLS, Daraja IP allowlist, hardened headers.
#
# This file is stored outside conf.d/ so Docker Compose (which mounts
# deploy/nginx/conf.d/*.conf) does not load it together with default.conf
# (duplicate upstream names would crash nginx).
#
# For host nginx: copy to /etc/nginx/conf.d/default.conf (after Certbot).
# Certbot writes /etc/letsencrypt/live/<domain>/fullchain.pem + privkey.pem
# (see docs/runbooks/tls.md for the bootstrap process).

include /etc/nginx/conf.d/mpesa-allowlist.conf;

upstream backend  { server backend:8000; }
upstream frontend { server frontend:3000; }

# Redirect all plaintext HTTP to HTTPS (except the ACME challenge that
# Certbot needs to renew).
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/landloads/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/landloads/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # M-Pesa Daraja webhooks: allow only Safaricom callback ranges.
    location /api/webhooks/mpesa/ {
        if ($is_daraja = 0) { return 403; }
        proxy_pass http://backend/webhooks/mpesa/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
    }

    location /api/ {
        proxy_pass http://backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /healthz { proxy_pass http://backend/healthz; }
    location = /readyz  { proxy_pass http://backend/readyz; }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
